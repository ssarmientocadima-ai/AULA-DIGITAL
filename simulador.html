<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de exámenes | AULA DIGITAL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fondo:#F2F6FB;--tinta:#0E1A2B;--texto:#3A4A5F;--acento:#2F5BFF;--suave:#E3EAFF;--ok:#0B8A69;--okbg:#DDF6EE;--mal:#C62F3B;--malbg:#FDE6E8;--linea:#D5DEEB;--blanco:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.6;font-size:17px}
h1,h2,h3{font-family:Sora,"Segoe UI",Arial,sans-serif;color:var(--tinta);line-height:1.25}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem)}
h2{font-size:1.35rem;margin-bottom:.5rem}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
header{background:var(--tinta);padding:14px 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center}
header b{font-family:Sora,Arial,sans-serif;color:#fff}
header a{color:#C9D5E8;text-decoration:none;font-weight:600}
.wrap{max-width:860px;margin:0 auto}
main{padding:36px 18px 60px}
[hidden]{display:none!important}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:22px;margin-top:16px}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;font-weight:600;font-size:1rem;font-family:inherit;cursor:pointer;background:var(--acento);color:#fff;border:2px solid var(--acento)}
.btn:hover{background:#1F45D6;border-color:#1F45D6}
.btn.claro{background:transparent;color:var(--tinta);border-color:var(--tinta)}
.btn.claro:hover{background:var(--tinta);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Menú de simulacros */
.lista{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sim{text-align:left;background:var(--blanco);border:2px solid var(--linea);border-radius:14px;padding:20px;cursor:pointer;font-family:inherit;font-size:1rem;color:var(--texto)}
.sim:hover{border-color:var(--acento)}
.sim h3{margin-bottom:6px}
.sim small{display:block;margin-top:8px;color:var(--ok);font-weight:600}

/* Examen */
.barra{position:sticky;top:0;background:var(--fondo);padding:10px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--linea)}
.reloj{font-family:Sora,Arial,sans-serif;font-size:1.4rem;color:var(--tinta);font-weight:700}
.reloj.poco{color:var(--mal)}
.materia{display:inline-block;background:var(--suave);color:var(--acento);font-weight:600;font-size:.85rem;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.enunciado{font-size:1.15rem;color:var(--tinta);margin-bottom:14px}
.op{display:block;width:100%;text-align:left;font-family:inherit;font-size:1rem;color:var(--tinta);background:var(--fondo);border:2px solid var(--linea);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer}
.op:hover{border-color:var(--acento)}
.op.sel{border-color:var(--acento);background:var(--suave);font-weight:600}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.nav button{width:42px;height:42px;border-radius:8px;border:2px solid var(--linea);background:var(--blanco);font-weight:600;cursor:pointer;font-family:inherit;color:var(--tinta)}
.nav button.resp{background:var(--suave);border-color:var(--acento)}
.nav button.actual{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}

/* Resultados */
.nota{font-family:Sora,Arial,sans-serif;font-size:3rem;color:var(--tinta);line-height:1}
.rev{border-left:5px solid var(--linea)}
.rev.bien{border-left-color:var(--ok)}
.rev.mal{border-left-color:var(--mal)}
.tu{padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:600}
.tu.bien{background:var(--okbg);color:var(--ok)}
.tu.mal{background:var(--malbg);color:var(--mal)}
.exp{margin-top:8px;font-size:.95rem}
</style>
</head>
<body>

<header><div class="wrap"><b>AULA DIGITAL</b><a href="index.html">← Volver al inicio</a></div></header>

<main class="wrap">

<!-- MENÚ: elige un simulacro -->
<section id="menu">
  <h1>Simulador de exámenes</h1>
  <p>Elige un simulacro, responde con el tiempo límite y al final verás tu puntaje y las respuestas correctas.</p>
  <div class="lista" id="lista"></div>
</section>

<!-- EXAMEN -->
<section id="examen" hidden>
  <div class="barra"><strong id="titulo"></strong><span class="reloj" id="reloj">00:00</span></div>
  <div class="card">
    <span class="materia" id="materia"></span>
    <p class="enunciado" id="enunciado"></p>
    <div id="opciones"></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="acciones">
    <div>
      <button class="btn claro" id="ant">Anterior</button>
      <button class="btn claro" id="sig">Siguiente</button>
    </div>
    <button class="btn" id="fin">Terminar examen</button>
  </div>
</section>

<!-- RESULTADO -->
<section id="resultado" hidden>
  <div class="card">
    <h2 id="resTitulo"></h2>
    <p class="nota" id="nota"></p>
    <p id="resDetalle"></p>
    <div class="acciones" style="justify-content:flex-start">
      <button class="btn" id="otro">Elegir otro simulacro</button>
      <button class="btn claro" id="repetir">Repetir este examen</button>
    </div>
  </div>
  <h2 style="margin-top:28px">Revisión y respuestas correctas</h2>
  <div id="revision"></div>
</section>

</main>

<script>
/* =====================================================
   TUS EXÁMENES: edita, agrega o borra aquí.
   - minutos: tiempo límite del simulacro
   - correcta: número de la opción correcta, empezando en 0
     (0 = primera opción, 1 = segunda, 2 = tercera, 3 = cuarta)
   Para agregar otro examen, copia un bloque { ... } y cambia los datos.
   ===================================================== */
var EXAMENES=[
 {id:"2026",titulo:"Examen 2026",minutos:20,preguntas:[
  {materia:"Matemática",texto:"Resuelve: 3x + 7 = 22",opciones:["x = 3","x = 5","x = 7","x = 15"],correcta:1,explicacion:"3x = 22 − 7 = 15, entonces x = 15 ÷ 3 = 5."},
  {materia:"Matemática",texto:"¿Cuál es el área de un triángulo de base 10 cm y altura 6 cm?",opciones:["16 cm²","30 cm²","60 cm²","32 cm²"],correcta:1,explicacion:"Área = (base × altura) ÷ 2 = (10 × 6) ÷ 2 = 30 cm²."},
  {materia:"Física",texto:"Un auto viaja a 20 m/s durante 15 s. ¿Qué distancia recorre?",opciones:["35 m","300 m","150 m","1,33 m"],correcta:1,explicacion:"En movimiento uniforme d = v · t = 20 × 15 = 300 m."},
  {materia:"Física",texto:"¿Cuál es la unidad de fuerza en el Sistema Internacional?",opciones:["Joule","Watt","Newton","Pascal"],correcta:2,explicacion:"La fuerza se mide en newton (N)."},
  {materia:"Química",texto:"¿Cuál es el símbolo químico del sodio?",opciones:["S","So","Na","N"],correcta:2,explicacion:"El sodio se representa con Na, de su nombre latino natrium."},
  {materia:"Química",texto:"¿Cuál es el número atómico del carbono?",opciones:["4","6","8","12"],correcta:1,explicacion:"El carbono tiene 6 protones, por eso su número atómico es 6."}
 ]},
 {id:"2025",titulo:"Examen 2025",minutos:15,preguntas:[
  {materia:"Matemática",texto:"¿Cuánto es el 15% de 200?",opciones:["20","25","30","35"],correcta:2,explicacion:"200 × 0,15 = 30."},
  {materia:"Matemática",texto:"Si a = 2 y b = 3, ¿cuál es el valor de a² + b²?",opciones:["10","13","12","25"],correcta:1,explicacion:"a² + b² = 4 + 9 = 13."},
  {materia:"Física",texto:"Un cuerpo de 5 kg tiene una aceleración de 4 m/s². ¿Qué fuerza actúa sobre él?",opciones:["1,25 N","9 N","20 N","0,8 N"],correcta:2,explicacion:"Segunda ley de Newton: F = m · a = 5 × 4 = 20 N."},
  {materia:"Química",texto:"¿Cuál es la fórmula química del agua?",opciones:["H₂O","CO₂","NaCl","O₂"],correcta:0,explicacion:"El agua está formada por dos átomos de hidrógeno y uno de oxígeno: H₂O."},
  {materia:"Química",texto:"¿Cuál es el pH de una sustancia neutra?",opciones:["0","7","14","1"],correcta:1,explicacion:"En la escala de pH, 7 es neutro; menor es ácido y mayor es básico."}
 ]}
];

/* ============ A partir de aquí no necesitas cambiar nada ============ */
var $=function(i){return document.getElementById(i)};
var ex,resp,act,resta,reloj,idx;

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function ver(id){["menu","examen","resultado"].forEach(function(s){$(s).hidden=(s!==id)});window.scrollTo(0,0)}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function mejor(id){try{return localStorage.getItem("mejor_"+id)}catch(e){return null}}
function guardar(id,v){try{var m=parseInt(mejor(id),10);if(isNaN(m)||v>m)localStorage.setItem("mejor_"+id,v)}catch(e){}}

function menu(){
  clearInterval(reloj);
  var l=$("lista");l.textContent="";
  EXAMENES.forEach(function(e,i){
    var b=el("button","sim");
    b.appendChild(el("h3","",e.titulo));
    b.appendChild(el("span","",e.preguntas.length+" preguntas · "+e.minutos+" minutos"));
    var m=mejor(e.id);
    if(m!==null)b.appendChild(el("small","","Tu mejor puntaje: "+m+"%"));
    b.onclick=function(){iniciar(i)};
    l.appendChild(b);
  });
  ver("menu");
}

function iniciar(i){
  idx=i;ex=EXAMENES[i];
  resp=ex.preguntas.map(function(){return null});
  act=0;resta=ex.minutos*60;
  $("titulo").textContent=ex.titulo;
  ver("examen");pintar();tic();
  clearInterval(reloj);reloj=setInterval(function(){resta--;tic();if(resta<=0)terminar(true)},1000);
}
function tic(){var r=$("reloj");r.textContent=fmt(resta);r.className="reloj"+(resta<=60?" poco":"")}

function pintar(){
  var p=ex.preguntas[act];
  $("materia").textContent=p.materia+" · Pregunta "+(act+1)+" de "+ex.preguntas.length;
  $("enunciado").textContent=p.texto;
  var o=$("opciones");o.textContent="";
  p.opciones.forEach(function(t,k){
    var b=el("button","op"+(resp[act]===k?" sel":""),String.fromCharCode(65+k)+") "+t);
    b.onclick=function(){resp[act]=k;pintar()};
    o.appendChild(b);
  });
  var n=$("nav");n.textContent="";
  ex.preguntas.forEach(function(_,k){
    var b=el("button",(k===act?"actual":resp[k]!==null?"resp":""),String(k+1));
    b.onclick=function(){act=k;pintar()};
    n.appendChild(b);
  });
  $("ant").disabled=act===0;
  $("sig").disabled=act===ex.preguntas.length-1;
}

function terminar(auto){
  if(!auto){
    var sin=resp.filter(function(r){return r===null}).length;
    if(!confirm(sin?"Te faltan "+sin+" pregunta(s) sin responder. ¿Terminar de todos modos?":"¿Terminar el examen y ver tu resultado?"))return;
  }
  clearInterval(reloj);
  var bien=0;
  ex.preguntas.forEach(function(p,i){if(resp[i]===p.correcta)bien++});
  var total=ex.preguntas.length,pct=Math.round(bien/total*100);
  var usado=ex.minutos*60-Math.max(0,resta);
  guardar(ex.id,pct);
  $("resTitulo").textContent=ex.titulo+(auto?" (se acabó el tiempo)":"");
  $("nota").textContent=pct+"%";
  $("resDetalle").textContent=bien+" correctas de "+total+" · Tiempo usado: "+fmt(usado);
  var rv=$("revision");rv.textContent="";
  ex.preguntas.forEach(function(p,i){
    var ok=resp[i]===p.correcta;
    var c=el("div","card rev "+(ok?"bien":"mal"));
    c.appendChild(el("span","materia",p.materia+" · Pregunta "+(i+1)));
    c.appendChild(el("p","enunciado",p.texto));
    var tu=resp[i]===null?"No respondiste":"Tu respuesta: "+String.fromCharCode(65+resp[i])+") "+p.opciones[resp[i]];
    c.appendChild(el("p","tu "+(ok?"bien":"mal"),(ok?"✔ ":"✘ ")+tu));
    if(!ok)c.appendChild(el("p","tu bien","Respuesta correcta: "+String.fromCharCode(65+p.correcta)+") "+p.opciones[p.correcta]));
    if(p.explicacion)c.appendChild(el("p","exp","Explicación: "+p.explicacion));
    rv.appendChild(c);
  });
  ver("resultado");
}

$("ant").onclick=function(){if(act>0){act--;pintar()}};
$("sig").onclick=function(){if(act<ex.preguntas.length-1){act++;pintar()}};
$("fin").onclick=function(){terminar(false)};
$("otro").onclick=menu;
$("repetir").onclick=function(){iniciar(idx)};
menu();
</script>
</body>
</html>
